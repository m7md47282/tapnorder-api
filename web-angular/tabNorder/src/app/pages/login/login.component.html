<div class="min-h-screen bg-gradient-hero flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <app-card class="backdrop-blur-sm bg-white/10 border-white/20">
      <app-card-header class="text-center">
        <div class="mx-auto w-16 h-16 bg-primary/20 rounded-full flex items-center justify-center mb-4">
          <span class="text-primary text-2xl">🏢</span>
        </div>
        <app-card-title class="text-2xl font-bold text-white">
          Staff Login
        </app-card-title>
        <app-card-description class="text-white/80">
          Sign in to access your dashboard
        </app-card-description>
      </app-card-header>
      
      <app-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
          <div *ngIf="error" class="bg-destructive/15 border border-destructive/20 text-destructive px-4 py-3 rounded-md">
            {{ error }}
          </div>
          
          <div class="space-y-2">
            <label for="email" class="text-white">
              Email
            </label>
            <div class="relative">
              <span class="absolute left-3 top-3 text-muted-foreground">✉️</span>
              <app-input
                id="email"
                type="email"
                placeholder="Enter your email"
                formControlName="email"
                class="pl-10 bg-white/10 border-white/20 text-white placeholder:text-white/50"
                [class.border-destructive]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                [disabled]="isLoading"
              />
            </div>
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-sm text-destructive">
              <div *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</div>
              <div *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</div>
            </div>
          </div>
          
          <div class="space-y-2">
            <label for="password" class="text-white">
              Password
            </label>
            <div class="relative">
              <span class="absolute left-3 top-3 text-muted-foreground">🔒</span>
              <app-input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Enter your password"
                formControlName="password"
                class="pl-10 pr-10 bg-white/10 border-white/20 text-white placeholder:text-white/50"
                [class.border-destructive]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                [disabled]="isLoading"
              />
              <button
                type="button"
                class="absolute right-0 top-0 h-full px-3 py-2 hover:bg-transparent text-white/50 hover:text-white"
                (click)="togglePasswordVisibility()"
                [disabled]="isLoading"
              >
                {{ showPassword ? '🙈' : '👁️' }}
              </button>
            </div>
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-sm text-destructive">
              <div *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</div>
              <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</div>
            </div>
          </div>
          
          <app-button
            type="submit"
            variant="default"
            size="lg"
            class="w-full bg-primary hover:bg-primary/90"
            [disabled]="loginForm.invalid || isLoading"
          >
            <span *ngIf="isLoading">Signing in...</span>
            <span *ngIf="!isLoading">Sign In</span>
          </app-button>
        </form>
        
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <span class="w-full border-t border-white/20"></span>
          </div>
          <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-gradient-hero px-2 text-white/60">Or continue with</span>
          </div>
        </div>
        
        <app-button
          type="button"
          variant="outline"
          size="lg"
          class="w-full border-white/20 text-white hover:bg-white/10"
          (click)="onGoogleSignIn()"
          [disabled]="isLoading"
        >
          <span *ngIf="isLoading">Signing in...</span>
          <span *ngIf="!isLoading">
            <svg class="mr-2 h-4 w-4 inline" viewBox="0 0 24 24">
              <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
          </span>
        </app-button>
        
        <div class="mt-6 text-center">
          <p class="text-sm text-white/60">
            Don't have an account?&nbsp;
            <a routerLink="/setup-admin" class="text-primary hover:text-primary/80 underline">
              Contact your administrator
            </a>
          </p>
        </div>
      </app-card-content>
    </app-card>
  </div>
</div>
