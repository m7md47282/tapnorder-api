<div class="min-h-screen bg-background">
  <!-- Header -->
  <header class="border-b">
    <div class="container mx-auto px-4 py-6">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-primary">Menu</h1>
        <nav class="flex items-center space-x-4">
          <a routerLink="/" class="text-sm font-medium hover:text-primary">Home</a>
          <a routerLink="/cart" class="text-sm font-medium hover:text-primary">Cart</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Menu Content -->
  <main class="container mx-auto px-4 py-8">
    <div class="mb-8">
      <h2 class="text-3xl font-bold text-foreground mb-4">Our Menu</h2>
      <p class="text-muted-foreground">Discover our delicious selection of dishes</p>
    </div>

    <!-- Category Filter -->
    <div class="mb-8">
      <div class="flex flex-wrap gap-2">
        <app-button
          *ngFor="let category of categories"
          [variant]="selectedCategory === category ? 'default' : 'outline'"
          size="sm"
          (onClick)="filterByCategory(category)"
        >
          {{ category }}
        </app-button>
      </div>
    </div>

    <!-- Menu Items -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <app-card *ngFor="let item of filteredMenuItems" class="hover:shadow-lg transition-shadow">
        <app-card-header>
          <div class="flex items-start justify-between">
            <div>
              <app-card-title>{{ item.name }}</app-card-title>
              <app-card-description>{{ item.description }}</app-card-description>
            </div>
            <app-badge [variant]="item.available ? 'success' : 'destructive'">
              {{ item.available ? 'Available' : 'Unavailable' }}
            </app-badge>
          </div>
        </app-card-header>
        <app-card-content>
          <div class="flex items-center justify-between">
            <span class="text-2xl font-bold text-primary">${{ item.price | currency }}</span>
            <app-button
              [disabled]="!item.available"
              size="sm"
              (onClick)="addToCart(item)"
            >
              Add to Cart
            </app-button>
          </div>
        </app-card-content>
      </app-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredMenuItems.length === 0" class="text-center py-12">
      <h3 class="text-xl font-semibold text-foreground mb-2">No items found</h3>
      <p class="text-muted-foreground">Try selecting a different category</p>
    </div>
  </main>
</div>
