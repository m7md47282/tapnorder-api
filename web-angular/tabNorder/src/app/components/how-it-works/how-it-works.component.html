<section class="py-20 bg-background">
  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <h2 class="text-4xl lg:text-5xl font-bold text-foreground mb-6">
        How It <span class="gradient-text">Works</span>
      </h2>
      <p class="text-xl text-muted-foreground max-w-3xl mx-auto">
        Simple, fast, and intuitive. Transform your restaurant experience in just four easy steps.
      </p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
      <div 
        *ngFor="let step of steps; let i = index"
        class="relative group"
      >
        <!-- Connecting line for larger screens -->
        <div 
          *ngIf="i < steps.length - 1" 
          class="hidden lg:block absolute top-20 left-full w-full h-0.5 bg-gradient-to-r from-primary/30 to-secondary/30 z-0"
        ></div>
        
        <div class="relative bg-card rounded-3xl p-8 shadow-elegant hover:shadow-glow transition-all duration-300 group-hover:-translate-y-2 z-10">
          <!-- Step number -->
          <div class="absolute -top-4 -left-4 w-8 h-8 bg-gradient-primary rounded-full flex items-center justify-center text-white font-bold text-sm shadow-glow">
            {{ i + 1 }}
          </div>

          <!-- Icon -->
          <div class="w-16 h-16 rounded-2xl bg-gradient-primary/10 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
            <span class="text-3xl">{{ step.icon }}</span>
          </div>

          <!-- Content -->
          <h3 class="text-xl font-bold text-card-foreground mb-4">
            {{ step.title }}
          </h3>
          <p class="text-muted-foreground leading-relaxed">
            {{ step.description }}
          </p>
        </div>
      </div>
    </div>

    <!-- Bottom CTA -->
    <div class="text-center mt-16">
      <div class="inline-flex items-center gap-2 bg-gradient-hero rounded-full px-6 py-3 text-white">
        <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
        Ready in under 2 minutes
      </div>
    </div>
  </div>
</section>
